name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.100.0 --profile minimal -c rustfmt -c clippy
      - run: rustup default 1.100.0
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .

  release:
    needs: [rust, web, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: rustup default 1.100.0
      - run: cargo build --release --locked
      - name: Package and publish latest commit release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          sed -i "s/misfinanzas-shell-v8/misfinanzas-shell-${SHORT_SHA}/" static/sw.js
          tar -czf finapp-linux-x86_64.tar.gz -C target/release finapp -C ../.. static
          git checkout -- static/sw.js
          sha256sum finapp-linux-x86_64.tar.gz > finapp-linux-x86_64.tar.gz.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          NOTES="Versión automática del último commit verificado en \`main\` (\`${SHORT_SHA}\`)."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "MisFinanzas (${SHORT_SHA})" --notes "$NOTES" --target "$GITHUB_SHA"
            gh release upload latest finapp-linux-x86_64.tar.gz finapp-linux-x86_64.tar.gz.sha256 --clobber
          else
            gh release create latest finapp-linux-x86_64.tar.gz finapp-linux-x86_64.tar.gz.sha256 \
              --title "MisFinanzas (${SHORT_SHA})" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi
